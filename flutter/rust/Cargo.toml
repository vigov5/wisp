[package]
name = "wisp_bridge"
version = "1.7.0"
edition = "2021"

[workspace]

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
anyhow = "1.0"
wisp-app = { path = "../../crates/app" }
wisp-core = { path = "../../crates/core" }
flutter_rust_bridge = "=2.12.0"
iroh = "1.0"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
time = { version = "0.3", features = ["formatting", "parsing"] }
tokio = { version = "1.50", features = [
    "fs",
    "rt-multi-thread",
    "sync",
    "time",
] }
tokio-stream = "0.1"
futures-lite = "2.3"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(target_os = "android")'.dependencies]
tracing = "0.1"
tracing-android = "0.2"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "z"
strip = "symbols"

# Keep the small bridge crate size-optimized, but compile the transfer stack,
# BLAKE3, and QUIC/AEAD dependencies for runtime speed. `opt-level = "z"`
# disables loop vectorization and can otherwise make CPU the bottleneck before
# Wi-Fi, relay, or USB bandwidth is saturated.
[profile.release.package."*"]
opt-level = 3

# Optimize dependencies (e.g. blake3, iroh) even in debug builds. Without this,
# deps compile at opt-level=0 and on-device hashing/crypto runs ~25x slower
# (BLAKE3 measured 28 MB/s debug vs 747 MB/s optimized), making debug transfers
# painfully slow. The bridge crate itself stays unoptimized for fast rebuilds.
#
# `debug = "line-tables-only"` keeps `file:line` in backtraces from dep frames
# but drops the type/variable DWARF, which is most of the .so size and link
# time. Deps stay cached — this profile is fixed, so only the first build after
# this change recompiles them.
[profile.dev.package."*"]
opt-level = 3
debug = "line-tables-only"

# The bridge crate itself (a workspace member) keeps full debug info.
[profile.dev]
debug = "full"

[profile.dev.build-override]
debug = false

# wisp-app / wisp-core are path dependencies here, not workspace members, so the
# `*` glob above would strip their debug info too. Pin them to full debug while
# keeping opt-level = 3: they hold the transfer loop, and at opt-level = 0
# on-device debug transfers get noticeably slower. Drop opt-level to 0 here
# temporarily if you need clean step-debugging through those crates.
[profile.dev.package.wisp-app]
opt-level = 3
debug = "full"

[profile.dev.package.wisp-core]
opt-level = 3
debug = "full"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
