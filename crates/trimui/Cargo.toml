[package]
name = "wisp-trimui"
version.workspace = true
edition.workspace = true

[[bin]]
name = "wisp-trimui"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
wisp-app = { path = "../app" }
wisp-core = { path = "../core" }
iroh.workspace = true
rand.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
time.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# Pure-Rust glyph rasterizer and QR encoder. Both are dependency-light and
# build for `aarch64-unknown-linux-musl` without a C toolchain, which is the
# whole point of not using SDL2 here — see README.md.
fontdue = "0.9"
qrcode = { version = "0.14", default-features = false }

# Only the framebuffer/evdev backend needs libc (ioctl, mmap, read). Every
# other module is portable, so the crate still `cargo check`s on Windows and
# macOS with the stub backend in `platform::other`.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
