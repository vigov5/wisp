[package]
name = "wisp-core"
version.workspace = true
edition.workspace = true

[dependencies]
wisp-wire = { path = "../wire" }
# `iroh-blobs` exposes these in its public API but re-exports none of them, and
# the streaming receive path needs all three: `BaoContentItem` to read the get
# fsm's output, and `Bytes` + `n0_error::Result` to implement `SimpleStore`.
# Must track the versions `iroh-blobs` itself resolves, or the types will not
# match.
bao-tree = "0.16"
bytes = "1"
n0-error = "1.0"
blake3.workspace = true
base64.workspace = true
bincode.workspace = true
flume.workspace = true
futures-lite.workspace = true
if-addrs.workspace = true
iroh.workspace = true
iroh-blobs.workspace = true
irpc.workspace = true
mdns-sd.workspace = true
netdev.workspace = true
rand.workspace = true
rustls.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
time.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tracing.workspace = true
thiserror.workspace = true
walkdir.workspace = true

[dev-dependencies]
# `quic_baseline` (examples/) is a benchmark binary, not library code.
anyhow.workspace = true
# `lan_tls` produces rustls configs; only its tests drive an actual handshake.
# Stays a dev-dependency until the transport that dials and accepts lands, so
# the shipped graph does not carry a TLS stream wrapper nothing calls yet.
tokio-rustls.workspace = true
# Only for the E2 congestion-control A/B in `quic_baseline`: iroh re-exports the
# `ControllerFactory` trait but not the concrete `CubicConfig` / `Bbr3Config`.
# A dev-dependency keeps it out of the shipped dependency graph, which is what
# the plan requires of a benchmark-only override. Must track iroh's own
# noq-proto version or the trait will not match.
noq-proto = "1.1"
filetime = "0.2"
tempfile = "3.27.0"
tracing-subscriber.workspace = true
