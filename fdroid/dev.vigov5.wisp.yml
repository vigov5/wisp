IssueTracker: https://github.com/vigov5/wisp/issues
Changelog: https://github.com/vigov5/wisp/releases

AutoName: Wisp

RepoType: git
Repo: https://github.com/vigov5/wisp.git

Builds:
  - versionName: 2.8.4
    versionCode: 1035
    commit: 3537132a7960042bed30a72db2c60f6497cf1bc5
    subdir: flutter
    sudo:
      - apt-get update
      - apt-get install -y gcc libc-dev make rustup
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    srclibs:
      - flutter@3.41.9
    rm:
      - docs
      - web
      - flutter/ios
      - flutter/macos
      - flutter/linux
      - flutter/windows
      - flutter/web
    prebuild:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
      - rustup toolchain install 1.95.0 --profile minimal --target armv7-linux-androideabi
      - rustup default 1.95.0
      - rm -rf "$(rustup show home)/toolchains/stable-x86_64-unknown-linux-gnu"
      - ln -s "$(rustup show home)/toolchains/1.95.0-x86_64-unknown-linux-gnu" "$(rustup
        show home)/toolchains/stable-x86_64-unknown-linux-gnu"
    scandelete:
      - flutter/.pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform="android-arm"
        --dart-define=WISP_FDROID=true
    ndk: r28c

