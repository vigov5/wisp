name: Flutter CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  # Keep in step with FLUTTER_VERSION in flutter-release.yml.
  FLUTTER_VERSION: "3.41.9"

jobs:
  flutter:
    name: Flutter CI
    runs-on: macos-latest

    defaults:
      run:
        working-directory: flutter

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            flutter
            crates
            third_party
            Cargo.toml
            Cargo.lock

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-expand,flutter_rust_bridge_codegen@2.12.0

      - name: Fetch dependencies
        run: flutter pub get

      - name: Run code generation
        run: flutter_rust_bridge_codegen generate

      - name: Analyze
        run: flutter analyze

      - name: Run unit tests
        run: flutter test
